name: ARM64 build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify host and toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Test
        run: ./script/test.sh
      - name: Build local package
        run: |
          ./script/build.sh --release
          ./script/package.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: MiniCal-local-${{ matrix.os }}
          path: dist/packages/*
          if-no-files-found: error
